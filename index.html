<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Kipouk — Конструктор Ботов</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.css">
    <script src="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; background: #0f0f17; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 12px 20px; background: #181825; display: flex; gap: 15px; border-bottom: 1px solid #313244; }
        input[type="text"], select { background: #313244; border: 1px solid #45475a; padding: 8px; color: #fff; border-radius: 6px; flex: 1; }
        button { background: #89b4fa; border: none; padding: 10px 18px; font-weight: bold; border-radius: 6px; cursor: pointer; color: #11111b; }
        button:hover { background: #b4befe; }
        main { flex: 1; display: flex; }
        .sidebar { width: 260px; background: #181825; padding: 15px; border-right: 1px solid #313244; z-index: 10; }
        .btn-add { background: #313244; color: #89b4fa; border: 1px solid #89b4fa; width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; cursor: pointer; text-align: left; }
        #drawflow { width: 100%; height: 100%; background: #11111b; }
        
        .drawflow .drawflow-node { background: #1e1e2e; border: 2px solid #89b4fa; color: #fff; border-radius: 8px; width: 260px; padding: 12px; }
        .drawflow .drawflow-node input, .drawflow .drawflow-node textarea, .drawflow .drawflow-node select { width: 100%; background: #313244; border: 1px solid #45475a; color: #fff; padding: 6px; border-radius: 4px; margin-top: 5px; }
        .drawflow .drawflow-node .input, .drawflow .drawflow-node .output { background: #89b4fa; width: 14px; height: 14px; }
    </style>
</head>
<body>

<header>
    <h3 style="margin: 0; color: #89b4fa;">Kipouk</h3>
    <input type="text" id="botToken" placeholder="Токен бота Telegram">
    <button onclick="deployBot()">Запустить бота</button>
</header>

<main>
    <div class="sidebar">
        <h4>Добавить блок</h4>
        <button class="btn-add" onclick="addMsgNode()">+ Блок сообщения</button>
    </div>
    <div id="drawflow"></div>
</main>

<script>
    const id = document.getElementById("drawflow");
    const editor = new Drawflow(id);
    editor.start();

    // Стартовый узел по умолчанию (/start)
    editor.addNode('message', 0, 1, 50, 100, 'node_1', {}, `
        <div>
            <b style="color:#89b4fa">Триггер / Ответ</b><br>
            <input type="text" id="trigger_1" placeholder="Триггер (напр: /start или привет)" value="/start">
            <textarea id="text_1" rows="2" placeholder="Ответ бота...">Привет! Выбери действие:</textarea>
            <input type="text" id="btn_1" placeholder="Текст кнопки">
            <select id="type_1">
                <option value="inline">С дропом (Inline-кнопка)</option>
                <option value="reply">Без дропа (Меню внизу)</option>
            </select>
        </div>
    `);

    function addMsgNode() {
        const nodeId = Date.now();
        editor.addNode('message', 1, 1, 360, 150, `node_${nodeId}`, {}, `
            <div>
                <b>Следующий ответ</b><br>
                <input type="text" id="trigger_${nodeId}" placeholder="Триггер (или оставь пустым)">
                <textarea id="text_${nodeId}" rows="2" placeholder="Ответ бота..."></textarea>
                <input type="text" id="btn_${nodeId}" placeholder="Текст кнопки">
                <select id="type_${nodeId}">
                    <option value="inline">С дропом (Inline-кнопка)</option>
                    <option value="reply">Без дропа (Меню внизу)</option>
                </select>
            </div>
        `);
    }

    async function deployBot() {
        const token = document.getElementById('botToken').value.trim();
        if (!token) return alert('Укажите токен!');

        const rawGraph = editor.export();
        const nodesData = rawGraph.drawflow.Home.data;

        // Собираем значения со всех полей ввода
        for (const [id, node] of Object.entries(nodesData)) {
            const rawId = id === '1' ? '1' : node.html.match(/id="text_(\d+)"/)[1];
            
            const trg = document.getElementById(`trigger_${rawId}`);
            const txt = document.getElementById(`text_${rawId}`);
            const btn = document.getElementById(`btn_${rawId}`);
            const typ = document.getElementById(`type_${rawId}`);

            node.custom_trigger = trg ? trg.value.trim() : "";
            node.custom_text = txt ? txt.value : "";
            node.custom_btn = btn ? btn.value.trim() : "";
            node.custom_type = typ ? typ.value : "inline";
        }

        const res = await fetch('/api/start-bot', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token, graph: rawGraph })
        });

        const data = await res.json();
        alert(data.message);
    }
</script>

</body>
</html>
