<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Kipouk — Конструктор Ботов</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.css">
    <script src="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; background: #0f0f17; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 12px 20px; background: #181825; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #313244; }
        input[type="text"], select, textarea { background: #313244; border: 1px solid #45475a; padding: 6px; color: #fff; border-radius: 6px; width: 100%; margin-top: 4px; }
        input[type="file"] { margin-top: 6px; font-size: 12px; color: #a6adc8; width: 100%; }
        button { background: #89b4fa; border: none; padding: 8px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; color: #11111b; }
        button:hover { background: #b4befe; }
        .btn-secondary { background: #313244; color: #cdd6f4; border: 1px solid #45475a; }
        .btn-secondary:hover { background: #45475a; color: #fff; }
        main { flex: 1; display: flex; }
        .sidebar { width: 260px; background: #181825; padding: 15px; border-right: 1px solid #313244; z-index: 10; display: flex; flex-direction: column; gap: 10px; }
        .btn-add { background: #313244; color: #89b4fa; border: 1px solid #89b4fa; width: 100%; padding: 10px; border-radius: 6px; cursor: pointer; text-align: left; font-weight: 500; }
        .btn-add:hover { background: #45475a; }
        #drawflow { width: 100%; height: 100%; background: #11111b; }
        
        .drawflow .drawflow-node { background: #1e1e2e; border: 2px solid #89b4fa; color: #fff; border-radius: 8px; width: 280px; padding: 12px; }
        .drawflow .drawflow-node.trigger-node { border-color: #f38ba8; }
        .drawflow .drawflow-node.input-node { border-color: #a6e3a1; }
        .drawflow .drawflow-node.media-node { border-color: #f9e2af; }
        .drawflow .drawflow-node.getid-node { border-color: #cba6f7; }
        .drawflow .drawflow-node label { font-size: 11px; color: #a6adc8; display: block; margin-top: 6px; }
        .drawflow .drawflow-node .input, .drawflow .drawflow-node .output { background: #89b4fa; width: 14px; height: 14px; }
    </style>
</head>
<body>

<header>
    <h3 style="margin: 0; color: #89b4fa;">Kipouk</h3>
    <input type="text" id="botToken" placeholder="Токен бота Telegram" style="margin-top:0; width:280px;">
    
    <button class="btn-secondary" onclick="exportProject()">💾 Сохранить (.kipouk)</button>
    <button class="btn-secondary" onclick="document.getElementById('importFile').click()">📂 Загрузить (.kipouk)</button>
    <input type="file" id="importFile" accept=".kipouk" style="display:none;" onchange="importProject(event)">

    <button onclick="deployBot()" style="margin-left: auto;">Запустить бота</button>
</header>

<main>
    <div class="sidebar">
        <h4>Добавить блоки</h4>
        <button class="btn-add" onclick="addTriggerNode()">⚡ Блок Триггер</button>
        <button class="btn-add" onclick="addMessageNode()">💬 Блок Сообщение</button>
        <button class="btn-add" onclick="addInputNode()">📥 Блок Ввод переменной</button>
        <button class="btn-add" onclick="addMediaNode()">🖼️ Блок Фото / Файл</button>
        <button class="btn-add" style="border-color:#cba6f7; color:#cba6f7;" onclick="addGetIdNode()">🔍 Получить File ID</button>
    </div>
    <div id="drawflow"></div>
</main>

<script>
    const id = document.getElementById("drawflow");
    const editor = new Drawflow(id);
    editor.start();

    // Создаем начальный блок при старте
    addTriggerNode(50, 100, "/start");

    function addTriggerNode(x = 100, y = 100, defaultVal = "") {
        editor.addNode('trigger', 0, 1, x, y, 'trigger-node', {}, `
            <div class="node-content" data-type="trigger">
                <b style="color:#f38ba8">⚡ Триггер (Команда)</b>
                <label>Команда или слово:</label>
                <input type="text" class="field-trigger" placeholder="/start" value="${defaultVal}">
            </div>
        `);
    }

    function addMessageNode(x = 380, y = 100, textVal = "", typeVal = "inline", btnVal = "") {
        editor.addNode('message', 1, 1, x, y, 'message-node', {}, `
            <div class="node-content" data-type="message">
                <b style="color:#89b4fa">💬 Сообщение</b>
                <label>Текст (можно {имя}):</label>
                <textarea class="field-text" rows="2" placeholder="Привет!">${textVal}</textarea>
                
                <label>Кнопки (через запятую):</label>
                <input type="text" class="field-btn" placeholder="Кнопка 1, Кнопка 2" value="${btnVal}">
                
                <label>Тип кнопок:</label>
                <select class="field-type">
                    <option value="inline" ${typeVal==='inline'?'selected':''}>С дропом (Inline)</option>
                    <option value="reply" ${typeVal==='reply'?'selected':''}>Без дропа (Меню внизу)</option>
                </select>
            </div>
        `);
    }

    function addInputNode(x = 380, y = 280, textVal = "", varVal = "имя") {
        editor.addNode('input_var', 1, 1, x, y, 'input-node', {}, `
            <div class="node-content" data-type="input_var">
                <b style="color:#a6e3a1">📥 Ввод переменной</b>
                <label>Вопрос пользователю:</label>
                <textarea class="field-text" rows="2" placeholder="Как тебя зовут?">${textVal}</textarea>
                
                <label>Имя переменной:</label>
                <input type="text" class="field-var" placeholder="имя" value="${varVal}">
            </div>
        `);
    }

    function addMediaNode(x = 380, y = 460, mediaUrlVal = "", mediaTypeVal = "document", captionVal = "") {
        editor.addNode('media', 1, 1, x, y, 'media-node', {}, `
            <div class="node-content" data-type="media">
                <b style="color:#f9e2af">🖼️ Файл с ПК / File ID / Переменная</b>
                <label>Выберите файл с ПК:</label>
                <input type="file" class="field-file">
                
                <label>ИЛИ ссылка / File ID / переменная:</label>
                <input type="text" class="field-url" placeholder="https://..., File ID или {file_id}" value="${mediaUrlVal}">

                <label>Тип отправки:</label>
                <select class="field-media-type">
                    <option value="document" ${mediaTypeVal==='document'?'selected':''}>Документ / Файл</option>
                    <option value="photo" ${mediaTypeVal==='photo'?'selected':''}>Фотография</option>
                </select>

                <label>Подпись:</label>
                <textarea class="field-text" rows="2" placeholder="Лови файл!">${captionVal}</textarea>
            </div>
        `);
    }

    function addGetIdNode(x = 380, y = 640, textVal = "", varVal = "file_id") {
        editor.addNode('get_file_id', 1, 1, x, y, 'getid-node', {}, `
            <div class="node-content" data-type="get_file_id">
                <b style="color:#cba6f7">🔍 Получить File ID</b>
                <label>Запрос к пользователю:</label>
                <textarea class="field-text" rows="2" placeholder="Отправьте мне любой файл...">${textVal}</textarea>
                
                <label>Сохранить ID в переменную:</label>
                <input type="text" class="field-var" placeholder="file_id" value="${varVal}">
            </div>
        `);
    }

    // Экспорт проекта в .kipouk
    function exportProject() {
        const rawGraph = editor.export();
        const nodesData = rawGraph.drawflow.Home.data;

        for (const [nodeId, node] of Object.entries(nodesData)) {
            const nodeEl = document.getElementById(`node-${nodeId}`);
            if (nodeEl) {
                const trg = nodeEl.querySelector('.field-trigger');
                const txt = nodeEl.querySelector('.field-text');
                const varName = nodeEl.querySelector('.field-var');
                const btn = nodeEl.querySelector('.field-btn');
                const typ = nodeEl.querySelector('.field-type');
                const mediaType = nodeEl.querySelector('.field-media-type');
                const mediaUrl = nodeEl.querySelector('.field-url');

                if (trg) node.val_trigger = trg.value;
                if (txt) node.val_text = txt.value;
                if (varName) node.val_var = varName.value;
                if (btn) node.val_btn = btn.value;
                if (typ) node.val_type = typ.value;
                if (mediaType) node.val_media_type = mediaType.value;
                if (mediaUrl) node.val_media_url = mediaUrl.value;
            }
        }

        const projectData = {
            version: "1.4",
            app: "Kipouk",
            token: document.getElementById('botToken').value,
            graph: rawGraph
        };

        const jsonStr = JSON.stringify(projectData, null, 2);
        const blob = new Blob([jsonStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement("a");
        a.href = url;
        a.download = `project_${new Date().toISOString().slice(0,10)}.kipouk`;
        a.click();
        URL.revokeObjectURL(url);
    }

    // Импорт проекта из .kipouk
    function importProject(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const projectData = JSON.parse(e.target.result);
                if (projectData.app !== "Kipouk") return alert("Неверный формат файла .kipouk!");

                if (projectData.token) document.getElementById('botToken').value = projectData.token;

                editor.clear();
                editor.import(projectData.graph);

                setTimeout(() => {
                    const nodesData = projectData.graph.drawflow.Home.data;
                    for (const [nodeId, node] of Object.entries(nodesData)) {
                        const nodeEl = document.getElementById(`node-${nodeId}`);
                        if (nodeEl) {
                            const trg = nodeEl.querySelector('.field-trigger');
                            const txt = nodeEl.querySelector('.field-text');
                            const varName = nodeEl.querySelector('.field-var');
                            const btn = nodeEl.querySelector('.field-btn');
                            const typ = nodeEl.querySelector('.field-type');
                            const mediaType = nodeEl.querySelector('.field-media-type');
                            const mediaUrl = nodeEl.querySelector('.field-url');

                            if (trg && node.val_trigger !== undefined) trg.value = node.val_trigger;
                            if (txt && node.val_text !== undefined) txt.value = node.val_text;
                            if (varName && node.val_var !== undefined) varName.value = node.val_var;
                            if (btn && node.val_btn !== undefined) btn.value = node.val_btn;
                            if (typ && node.val_type !== undefined) typ.value = node.val_type;
                            if (mediaType && node.val_media_type !== undefined) mediaType.value = node.val_media_type;
                            if (mediaUrl && node.val_media_url !== undefined) mediaUrl.value = node.val_media_url;
                        }
                    }
                }, 100);

                alert("Проект успешно загружен!");
            } catch (err) {
                alert("Ошибка чтения файла: " + err.message);
            }
        };
        reader.readAsText(file);
        event.target.value = "";
    }

    async function uploadToTelegram(token, file, mediaType) {
        const formData = new FormData();
        const endpoint = mediaType === 'photo' ? 'sendPhoto' : 'sendDocument';
        const fieldName = mediaType === 'photo' ? 'photo' : 'document';
        formData.append('chat_id', '1796862570');
        formData.append(fieldName, file);

        const res = await fetch(`https://api.telegram.org/bot${token}/${endpoint}`, { method: 'POST', body: formData });
        const data = await res.json();
        if (data.ok) {
            return mediaType === 'photo' ? data.result.photo[data.result.photo.length - 1].file_id : data.result.document.file_id;
        } else {
            throw new Error(data.description || "Ошибка загрузки файла");
        }
    }

    async function deployBot() {
        const token = document.getElementById('botToken').value.trim();
        if (!token) return alert('Укажите токен!');

        const rawGraph = editor.export();
        const nodesData = rawGraph.drawflow.Home.data;

        for (const [nodeId, node] of Object.entries(nodesData)) {
            const nodeEl = document.getElementById(`node-${nodeId}`);
            if (nodeEl) {
                const contentEl = nodeEl.querySelector('.node-content');
                const nodeType = contentEl ? contentEl.getAttribute('data-type') : 'message';
                node.block_type = nodeType;
                
                const trg = nodeEl.querySelector('.field-trigger');
                const txt = nodeEl.querySelector('.field-text');
                const varName = nodeEl.querySelector('.field-var');
                const btn = nodeEl.querySelector('.field-btn');
                const typ = nodeEl.querySelector('.field-type');
                const mediaType = nodeEl.querySelector('.field-media-type');
                const mediaUrl = nodeEl.querySelector('.field-url');
                const fileInput = nodeEl.querySelector('.field-file');

                node.custom_trigger = trg ? trg.value.trim() : "";
                node.custom_text = txt ? txt.value : "";
                node.custom_var = varName ? varName.value.trim() : "";
                node.custom_btn = btn ? btn.value.trim() : "";
                node.custom_type = typ ? typ.value : "inline";
                
                const mType = mediaType ? mediaType.value : "document";
                node.custom_media_type = mType;
                
                let finalMediaUrl = mediaUrl ? mediaUrl.value.trim() : "";
                if (fileInput && fileInput.files[0]) {
                    try {
                        finalMediaUrl = await uploadToTelegram(token, fileInput.files[0], mType);
                    } catch (err) {
                        return alert(`Ошибка файла: ` + err.message);
                    }
                }
                node.custom_media_url = finalMediaUrl;
            }
        }

        try {
            const res = await fetch('/api/start-bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, graph: rawGraph })
            });

            const data = await res.json();
            if (res.ok) alert("Бот успешно запущен!");
            else alert('Ошибка: ' + (data.message || 'Неизвестная ошибка'));
        } catch (e) {
            alert('Ошибка сервера при сохранении бота');
        }
    }
</script>

</body>
</html>
