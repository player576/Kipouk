<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Kipouk — Конструктор Ботов</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.css">
    <script src="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { margin: 0; background: #0f0f17; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 12px; background: #181825; display: flex; gap: 10px; }
        input { background: #313244; border: 1px solid #45475a; padding: 10px; color: #fff; border-radius: 6px; flex: 1; }
        button { background: #89b4fa; border: none; padding: 10px 18px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        main { flex: 1; display: flex; }
        #drawflow { width: 100%; height: 100%; background: #11111b; }
        .drawflow .drawflow-node { background: #1e1e2e; border: 2px solid #89b4fa; color: #fff; border-radius: 8px; width: 220px; padding: 10px; }
        .drawflow .drawflow-node textarea { width: 100%; background: #313244; border: 1px solid #45475a; color: #fff; padding: 6px; border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <input type="text" id="botToken" placeholder="Введите токен Telegram-бота">
    <button onclick="deployBot()">Запустить на Vercel</button>
</header>

<main>
    <div id="drawflow"></div>
</main>

<script>
    const id = document.getElementById("drawflow");
    const editor = new Drawflow(id);
    editor.start();

    editor.addNode('start', 0, 1, 50, 100, 'start', {}, `
        <div>
            <b>Старт (/start)</b><br><br>
            <textarea id="start_text" rows="3">Привет! Мой бот запущен через Vercel.</textarea>
        </div>
    `);

    async function deployBot() {
        const token = document.getElementById('botToken').value.trim();
        if (!token) return alert('Введите токен!');

        let graph = editor.export();
        // Записываем текст из textarea напрямую в объект графа
        const startText = document.getElementById('start_text').value;
        graph.drawflow.Home.data[1].html_text = startText;

        const res = await fetch('/api/start-bot', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token, graph: graph })
        });

        const data = await res.json();
        alert(data.message);
    }
</script>
</body>
</html>
